<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona - API Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #3b82f6;
            --bot-msg: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #000000);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--chat-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideUp 0.3s ease-out;
            word-wrap: break-word;
        }

        .message.bot {
            background: var(--bot-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0 20px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        .loading {
            font-size: 0.8rem;
            color: var(--text-muted);
            align-self: flex-start;
            margin-left: 10px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>✨ Persona Bot</h1>
            <p>Connecté à l'API n8n via Webhook</p>
        </div>
        
        <div class="messages" id="chat-box">
            <div class="message bot">Bonjour ! Je suis l'API de Persona. De quoi veux-tu parler ?</div>
        </div>
        <div class="loading" id="loading-indicator">L'IA réfléchit...</div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Écris ton message ici..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        const N8N_WEBHOOK_URL = 'https://your-n8n-instance.example.com/webhook/api-chat';

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading-indicator');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Afficher le message de l'utilisateur
            appendMessage(text, 'user');
            userInput.value = '';
            
            // 2. Afficher "L'IA réfléchit..."
            loading.style.display = 'block';

            try {
                // 3. Appel de l'API (n8n Webhook)
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: "demo_user_123", // Identifiant fictif pour la démo
                        message: text
                    })
                });

                if (!response.ok) throw new Error("Erreur serveur API");

                // 4. On attend que n8n réponde avec un JSON
                const data = await response.json();
                
                // 5. Afficher la réponse de l'IA (en supposant que n8n renvoie { "reply": "..." })
                const botReply = data.reply || "Réponse reçue, mais le format JSON de l'API doit être adapté.";
                appendMessage(botReply, 'bot');

            } catch (error) {
                console.error(error);
                appendMessage("Oups, l'API n8n n'a pas répondu.", 'bot');
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
